[project]
name = "solver-assisted-logical-prediction"
version = "0.1.0"
description = "Sealed certificate-factorial lineage (v7, b11-b16) on solver-assisted logical prediction."
requires-python = ">=3.12"
dependencies = ["cc-instruments", "mlx", "mlx-lm", "numpy", "huggingface-hub>=0.30"]

[project.optional-dependencies]
pdf = ["reportlab"]

[tool.uv.sources]
cc-instruments = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scientist"]
