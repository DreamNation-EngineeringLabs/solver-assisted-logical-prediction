# b16 multi-model survey candidates. Smallest first: cheap failures surface early.
#
# `revision` MUST be a pinned commit sha before any sealed run. Fill via
#   uv run python scripts/screen_cognitive_binary_multimodel_b16.py --resolve-revisions
# A screen or sweep refuses to run against an unpinned entry.
#
# bf16 throughout: b14 used 4-bit, and mixing precisions across models would
# confound quantisation with model identity.

candidates = ["Yes", "No"]
candidates_three_way = ["Yes", "No", "Unknown"]

