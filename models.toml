# ---------------------------------------------------------------------------
# b15 is single-model and lives in its own table so the b16 sweep, which
# iterates `[[model]]`, never picks it up.
#
# Decision 2026-09-03: b15 runs 4-BIT, not the bf16 build listed above. The
# design rests on reusing b14's 50.0% / 87.0% anchors, and bf16 would make
# quantisation a confound in the one comparison b15 depends on. b16's bf16 3B
# supplies the quantisation comparison separately.
#
# This revision is the exact snapshot recorded in the frozen b14 runner
# (scripts/run_cognitive_solver_assisted_certificate_factorial_v8.py), verified
# 2026-09-03 to still resolve and to equal the repo head. b15 therefore scores on
# byte-identical weights to b14, not merely the same repo.
[[b15_model]]
key = "qwen2p5_3b_4bit"
repo = "mlx-community/Qwen2.5-3B-Instruct-4bit"
revision = "4f83f8f146fdf28b512a06562b671d7af4fab457"
family = "qwen2.5"
params_b = 3.0
role = "b15 only; byte-identical to the b14 snapshot"
